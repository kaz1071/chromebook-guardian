
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromebook Guardian</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 60px 20px;
}
main {
  max-width: 550px;
  margin: auto;
  background: #1e293b;
  padding: 35px;
  border-radius: 15px;
}
button {
  background: #38bdf8;
  color: #101827;
  border: 0;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
code {
  display: block;
  background: #0f172a;
  padding: 15px;
  margin: 20px 0;
  overflow-wrap: anywhere;
  border-radius: 8px;
}
</style>
</head>
<body>
<main>
<h1>🛡️ Chromebook Guardian</h1>
<p>Protect and manage your Chromebook.</p>
<h3>Launch Guardian</h3>
<p>Open Linux Terminal and run this command:</p>
<code id="command">curl -fsSLo /tmp/guardian.sh https://raw.githubusercontent.com/kaz1071/chromebook-guardian/main/guardian.sh && bash /tmp/guardian.sh</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('command').textContent).then(() => this.textContent='Copied!')">Copy Launch Command</button>
<p>Version 1.6-Beta</p>
</main>
</body>
</html>
